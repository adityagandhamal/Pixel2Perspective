[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel2perspective-bench"
version = "0.1"

authors = [
  { name="Aditya Gandhamal"},
  { name="Aniruddh Sikdar", email="aniruddhss@iisc.ac.in"},
  { name="Arya Kishor"},
  { name="Suresh Sundaram"},
]
description = "Pixel2Perspective: A Benchmark for Multi-Modal and Multi-View Generalization in Vision-Language Models"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
keywords = ["pixel2perspective", "benchmark", "open-vocabulary", "semantic-segmentation", "zero-shot", "rgb-infrared", "msriq"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    'torch>=1.10.1',
    'torchvision>=0.11.2',
    'pandas>=1.5.1',
    'numpy>=1.22.4,<2',
    'iopath>=0.1.7',
    'Pillow>=7.1',
    'tqdm>=4.64.1',
    'gdown>=4.6.4',
    'rasterio>=1.3.4',
]

[project.urls]
"Homepage" = "https://github.com/aniruddhsikdar/Pixel2Perspective"
"Related" = "https://arxiv.org/abs/2506.03709"

[tool.setuptools.packages.find]
where = ["."]
include = ["p2p", "p2p.*"]
